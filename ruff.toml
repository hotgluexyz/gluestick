target-version = "py310"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".secrets",
    ".vscode",
    "tests",
    "scripts"
]

[lint]
extend-select = [
    "C901",
    "ANN201",
    "ANN205",
    "ANN206",
]
ignore = ["E722", "E721"]
[lint.mccabe]
max-complexity = 17
